name: Publicar site no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Nomear artefato da tentativa
        id: artifact
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: "."

  deploy:
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.package.outputs.artifact_name }}

      - name: Notificar buscadores pelo IndexNow
        if: success()
        run: |
          curl --fail --silent --show-error             -X POST "https://api.indexnow.org/indexnow"             -H "Content-Type: application/json; charset=utf-8"             --data '{"host":"tiacristransporteescolar.com.br","key":"8040c9edd8409c80c2e6f0d6afb17d7f","keyLocation":"https://tiacristransporteescolar.com.br/8040c9edd8409c80c2e6f0d6afb17d7f.txt","urlList":["https://tiacristransporteescolar.com.br/","https://tiacristransporteescolar.com.br/colegio-policia-militar-unidade-penha/"]}'
